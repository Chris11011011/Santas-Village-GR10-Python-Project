name: Publish Santa's Village release

on:
  push:
    paths:
      - ".github/workflows/publish-santas-village-release.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download approved test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded package release-asset
          gh run download 35541163695 \
            --repo "${{ github.repository }}" \
            --name "Santas-Village-Windows-x64-Win11-ARM64-Test" \
            --dir downloaded
          unzip -q "downloaded/Santas-Village-Windows-x64-Win11-ARM64-Test.zip" -d package

      - name: Finalize release labeling
        run: |
          cat > "package/README - How to Play.txt" <<'EOF'
          Santa's Village
          Portable Windows build

          HOW TO PLAY
          1. Extract the entire ZIP file.
          2. Double-click Santas_Village.exe.
          3. Keep the jre, libraries, and runtime folders beside the EXE.

          No separate installation is required:
          - Processing.py / Jython runtime is bundled.
          - Java 8 x64 is bundled.
          - Minim 2.2.2 is bundled.
          - All original game assets are bundled.

          COMPATIBILITY
          - Windows 10/11 x64 (Intel/AMD)
          - Windows 11 ARM64 via built-in x64 application emulation (tested)
          - This is an x64 build, not a native ARM64 build
          - 32-bit Windows, macOS, and Linux are not supported by this package

          Original project by Christopher Lee.
          EOF
          cd package
          zip -qr "../release-asset/Santas-Village-Windows-x64-Win11-ARM64.zip" .

      - name: Publish v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Santa's Village — Windows Portable Build

          This release packages the original Grade 10 Processing Python Mode project into a self-contained Windows download. Processing, Python Mode, Java, and Minim do not need to be installed separately.

          ### Compatibility

          - **Windows 10/11 x64 (Intel/AMD):** supported
          - **Windows 11 ARM64:** supported through Windows' built-in x64 application emulation; tested on ARM64
          - **Native ARM64:** this is not a native ARM64 build
          - **32-bit Windows:** not supported by this package
          - **macOS / Linux:** not supported by this package

          ### How to try the demo

          1. Download `Santas-Village-Windows-x64-Win11-ARM64.zip`.
          2. Extract the **entire** ZIP.
          3. Double-click `Santas_Village.exe`.
          4. Keep the `jre`, `libraries`, and `runtime` folders beside the executable.

          ### Bundled runtime

          The package includes the Processing.py/Jython runtime, Processing 3.5.4-compatible runtime components, Java 8 x64, Minim 2.2.2, and the project's original image/audio/font assets.

          > The executable is unsigned, so Windows SmartScreen may show an **Unknown publisher** warning on some systems.
          EOF

          gh release create "v1.0.0" \
            "release-asset/Santas-Village-Windows-x64-Win11-ARM64.zip" \
            --repo "${{ github.repository }}" \
            --target "main" \
            --title "Santa's Village — Windows Portable Build v1.0.0" \
            --notes-file release-notes.md \
            --latest
